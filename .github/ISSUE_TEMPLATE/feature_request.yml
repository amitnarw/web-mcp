name: Feature request
description: Suggest an idea for Web MCP
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Have an idea for Web MCP? Tell us about it."
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: "Is your feature request related to a problem? Please describe."
      placeholder: "I'd like to… but Web MCP doesn't…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      placeholder: "Add a browser_export_tab tool that…"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "I tried X but Y…"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 10 / macOS 15 / Ubuntu 24.04"
    validations:
      required: false
