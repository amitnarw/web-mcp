<!DOCTYPE html>
<html class="dark h-full w-full overflow-hidden" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Web MCP</title>
<link href="fonts/inter.css" rel="stylesheet" />
<link href="fonts/geist.css" rel="stylesheet" />
<link href="fonts/outlined.css" rel="stylesheet" />
<link href="tailwind.css" rel="stylesheet" />
  <style>
    @keyframes neon-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes mesh-flow { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }
    .bp-premium-wrapper { position: relative; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .bp-premium-orb { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #131315; background-image: radial-gradient(circle at 0% 0%, rgba(0, 122, 255, 0.6) 0px, transparent 70%), radial-gradient(circle at 100% 100%, rgba(173, 198, 255, 0.6) 0px, transparent 70%), linear-gradient(135deg, rgba(0, 91, 193, 0.4) 0%, rgba(0, 122, 255, 0.4) 100%); background-size: 200% 200%; animation: mesh-flow 4s ease-in-out infinite; border: none; }
    .bp-orb-eyes { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 3px; z-index: 2; transition: transform 0.1s ease-out; transform: translate(var(--eye-x, 0px), var(--eye-y, 0px)); }
    .bp-orb-eye { width: 4px; height: 4px; background: #adc6ff; border-radius: 50%; animation: orb-blink 4s infinite; box-shadow: 0 0 4px rgba(173,198,255,0.5); }
    @keyframes orb-blink { 0%, 96%, 98% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    .bp-dialog-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2147483651; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: bp-fade-in-fast 0.2s ease-out; font-family: 'Inter', sans-serif; }
    @keyframes bp-fade-in-fast { from { opacity: 0; } to { opacity: 1; } }
    .bp-dialog { background: #131315; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); padding: 24px; width: 90%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; transform: scale(0.95); animation: bp-pop-in 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes bp-pop-in { to { transform: scale(1); } }
    .bp-dialog-title { font-size: 16px; font-weight: 600; color: #adc6ff; margin: 0; display: flex; align-items: center; gap: 8px; }
    .bp-dialog-desc { font-size: 14px; color: #c1c6d7; margin: 0; line-height: 1.5; }
    .bp-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .bp-dialog-btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
    .bp-dialog-btn-cancel { background: rgba(255,255,255,0.1); color: #c1c6d7; }
    .bp-dialog-btn-cancel:hover { background: rgba(255,255,255,0.15); color: #e4e2e4; }
    .bp-dialog-btn-stop { background: rgba(147,0,10,0.3); color: #ffb4ab; }
    .bp-dialog-btn-stop:hover { background: rgba(147,0,10,0.4); }

    /* ─── Multi-agent panel (bp- classes; not part of the compiled Tailwind set) ─── */
    .bp-hidden { display: none !important; }
    .bp-brand { font-weight: 700; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; background-image: linear-gradient(to right, #4b8eff, #adc6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .bp-header-right { display: flex; align-items: center; gap: 10px; }
    .bp-conn { display: flex; align-items: center; gap: 6px; font-family: Geist, sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.45); }
    .bp-conn-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffb4ab; box-shadow: 0 0 8px rgba(255,100,100,0.5); }
    .bp-conn.bp-on .bp-conn-dot { background: #34c759; box-shadow: 0 0 8px rgba(52,199,89,0.6); }
    .bp-halt-all-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px 5px 8px; border-radius: 9999px; border: 1px solid rgba(255,180,171,0.25); background: rgba(147,0,10,0.25); color: #ffb4ab; font-family: Geist, sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .bp-halt-all-btn:hover:not(:disabled) { background: rgba(147,0,10,0.45); }
    .bp-halt-all-btn:disabled { opacity: 0.35; cursor: default; }
    .bp-halt-all-btn .material-symbols-outlined { font-size: 15px; }
    .bp-version { font-family: Geist, sans-serif; font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 0.08em; margin-left: 6px; }

    .bp-banner { margin-top: 12px; padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.4; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: #c1c6d7; }
    .bp-banner.bp-banner-error { border-color: rgba(255,180,171,0.3); background: rgba(147,0,10,0.2); color: #ffb4ab; }

    .bp-agent-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .bp-agent-card { --bp-agent-color: #4b8eff; --bp-agent-rgb: 75, 142, 255; --bp-agent-light-rgb: 173, 198, 255; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 14px 17px; border-radius: 14px; background: rgba(44,44,46,0.4); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); transition: border-color 0.3s ease, box-shadow 0.3s ease; }
    .bp-agent-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bp-agent-color); opacity: 0.8; }
    .bp-agent-card.bp-is-active { border-color: rgba(var(--bp-agent-rgb), 0.45); box-shadow: 0 0 22px rgba(var(--bp-agent-rgb), 0.18), inset 0 1px 0 rgba(255,255,255,0.12); }
    .bp-agent-card.bp-is-halted::before { background: #ffb4ab; }
    .bp-agent-head { display: flex; align-items: center; gap: 10px; }
    .bp-agent-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--bp-agent-color); box-shadow: 0 0 8px rgba(var(--bp-agent-rgb), 0.6); }
    @keyframes bp-dot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.7; } }
    .bp-is-active .bp-agent-dot { animation: bp-dot-pulse 1.6s ease-in-out infinite; }
    .bp-agent-titles { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px; }
    .bp-agent-label { font-size: 14px; font-weight: 600; color: #e4e2e4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .bp-agent-client { font-family: Geist, sans-serif; font-size: 10px; color: #8b90a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em; }
    .bp-pill { flex-shrink: 0; font-family: Geist, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 9999px; border: 1px solid transparent; }
    .bp-pill-active { color: rgb(var(--bp-agent-light-rgb)); background: rgba(var(--bp-agent-rgb), 0.15); border-color: rgba(var(--bp-agent-rgb), 0.35); }
    .bp-pill-idle { color: #c1c6d7; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .bp-pill-halted { color: #ffb4ab; background: rgba(147,0,10,0.25); border-color: rgba(255,180,171,0.3); }
    .bp-agent-task { display: flex; flex-direction: column; gap: 2px; }
    .bp-agent-task-text { font-size: 13px; color: #e4e2e4; line-height: 1.35; word-break: break-word; }
    .bp-section-label { font-family: Geist, sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: #8b90a0; }
    .bp-agent-section { display: flex; flex-direction: column; gap: 6px; }
    .bp-tab-list { display: flex; flex-direction: column; gap: 4px; }
    .bp-tab-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: #c1c6d7; font-size: 12px; font-family: inherit; cursor: pointer; transition: background 0.2s ease; }
    .bp-tab-row:hover { background: rgba(255,255,255,0.07); }
    .bp-tab-row:disabled { cursor: default; opacity: 0.6; }
    .bp-tab-row.bp-is-current { border-color: rgba(var(--bp-agent-rgb), 0.4); color: #e4e2e4; }
    .bp-tab-row .material-symbols-outlined { font-size: 14px; color: #8b90a0; flex-shrink: 0; }
    .bp-tab-row.bp-is-current .material-symbols-outlined { color: rgb(var(--bp-agent-light-rgb)); }
    .bp-tab-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-tab-tag { flex-shrink: 0; font-family: Geist, sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: rgb(var(--bp-agent-light-rgb)); }
    .bp-tab-tag.bp-muted { color: #8b90a0; }
    .bp-empty-line { font-size: 12px; color: #8b90a0; font-style: italic; }
    .bp-action-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .bp-action-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; line-height: 1.4; color: #c1c6d7; }
    .bp-action-row.bp-is-latest { color: #e4e2e4; }
    .bp-action-row.bp-is-latest .bp-action-bullet { background: rgb(var(--bp-agent-light-rgb)); box-shadow: 0 0 6px rgba(var(--bp-agent-rgb), 0.7); }
    .bp-action-bullet { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    .bp-action-text { flex: 1; min-width: 0; word-break: break-word; }
    .bp-action-time { flex-shrink: 0; font-family: Geist, sans-serif; font-size: 10px; color: #8b90a0; }
    .bp-agent-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .bp-agent-error { flex: 1; font-size: 11px; color: #ffb4ab; word-break: break-word; }
    .bp-agent-btn { display: flex; align-items: center; gap: 4px; padding: 6px 12px 6px 9px; border-radius: 9999px; font-family: Geist, sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; }
    .bp-agent-btn .material-symbols-outlined { font-size: 15px; }
    .bp-agent-btn:disabled { opacity: 0.5; cursor: default; }
    .bp-agent-btn-halt { background: rgba(147,0,10,0.25); color: #ffb4ab; border-color: rgba(255,180,171,0.25); }
    .bp-agent-btn-halt:hover:not(:disabled) { background: rgba(147,0,10,0.45); }
    .bp-agent-btn-resume { background: rgba(var(--bp-agent-rgb), 0.2); color: rgb(var(--bp-agent-light-rgb)); border-color: rgba(var(--bp-agent-rgb), 0.4); }
    .bp-agent-btn-resume:hover:not(:disabled) { background: rgba(var(--bp-agent-rgb), 0.35); }

    .bp-log-line { margin-bottom: 2px; word-break: break-word; }
    .bp-log-time { color: #8b90a0; }
    .bp-log-meta { color: #adc6ff; margin-bottom: 8px; }
    .bp-log-error { color: #ffb4ab; }
  </style>
</head>
<body class="mesh-bg text-on-surface h-full w-full overflow-hidden flex flex-col font-body-lg m-0 p-0">
  <header class="flex justify-between items-center px-inner-padding h-16 w-full sticky top-0 z-50 bg-surface/60 dark:bg-surface/60 backdrop-blur-[32px] border-b border-white/10 shadow-none transition-colors shrink-0">
    <div class="flex items-center gap-2">
      <div class="text-on-surface-variant dark:text-on-surface-variant p-2 rounded-full flex items-center justify-center">
        <div id="spinner" class="hidden w-8 h-8 rounded-full bg-surface-container flex items-center justify-center relative">
          <div class="bp-premium-wrapper">
            <div class="bp-premium-orb">
              <div class="bp-orb-eyes">
                <div class="bp-orb-eye"></div>
                <div class="bp-orb-eye"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="bp-brand">Web MCP</div>
      <span id="version" class="bp-version"></span>
    </div>
    <div class="bp-header-right">
      <div id="conn" class="bp-conn" title="Connection to the Web MCP server">
        <span class="bp-conn-dot"></span>
        <span id="conn-text">Offline</span>
      </div>
      <button id="halt-all-btn" class="bp-halt-all-btn" type="button" disabled title="Halt every agent">
        <span class="material-symbols-outlined" data-icon="pause">pause</span> Halt all
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto custom-scrollbar pb-24 p-container-padding flex flex-col gap-section-gap">

    <div id="banner" class="bp-banner bp-hidden"></div>

    <!-- One card per agent (built by sidepanel.js) -->
    <div id="agents-list" class="bp-agent-list bp-hidden"></div>

    <!-- Empty / disconnected state -->
    <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center flex-1 py-10">
      <div class="w-16 h-16 rounded-full bg-surface-container-highest border border-outline/30 flex items-center justify-center mb-4">
        <span id="empty-icon" class="material-symbols-outlined text-outline text-3xl" data-icon="hourglass_empty">hourglass_empty</span>
      </div>
      <h2 id="empty-title" class="font-headline-md text-[16px] text-on-surface mb-1">Connecting&hellip;</h2>
      <p id="empty-desc" class="font-body-sm text-[12px] text-on-surface-variant max-w-[240px]">Looking for the Web MCP server.</p>
    </div>

    <!-- Debug Section -->
    <div class="mt-auto pt-6 border-t border-white/5 flex flex-col gap-4">
      <div id="debug-toggle" class="text-center font-label-md text-[11px] text-primary cursor-pointer hover:text-primary-container uppercase tracking-wider">Show Debug Logs</div>
      <div id="debug-section" class="hidden flex-col gap-2">
        <div class="flex justify-between items-center">
          <span class="font-label-md text-[11px] text-on-surface-variant uppercase">Debug Logs</span>
          <span id="debug-clear" class="font-label-md text-[11px] text-primary cursor-pointer hover:text-primary-container">Clear</span>
        </div>
        <div id="debug-logs" class="max-h-[200px] overflow-y-auto custom-scrollbar font-mono-code text-[11px] leading-relaxed text-on-surface-variant bg-surface-container-lowest p-3 rounded-lg border border-white/5"></div>
      </div>
    </div>
  </main>

  <script src="env.js"></script>
  <script src="server_api.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
